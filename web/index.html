<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Topográficos ABB</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar">
<button class="brand" data-go="projects">Topográficos ABB</button>
<div id="crumb" class="crumb" hidden><strong id="projectName"></strong><span id="saveStatus" class="muted">Guardado</span></div>
<div id="editorActions" class="actions" hidden>
<button id="undo" class="icon" title="Deshacer (Ctrl+Z)" aria-label="Deshacer">↶</button>
<button id="redo" class="icon" title="Rehacer (Ctrl+Y)" aria-label="Rehacer">↷</button>
<span class="sep"></span>
<div class="menu"><button id="normaChip" class="chip ok" aria-haspopup="true">Normativa ✓</button><div id="normaPanel" class="popover wide" hidden></div></div>
<div class="menu"><button id="moreBtn" class="icon" title="Más opciones" aria-label="Más opciones">⋯</button>
<div id="moreMenu" class="popover" hidden>
<label>Gabinete<select id="enclosure"></select></label>
<button id="autoLayout" class="menu-item">Rearmar el tablero</button>
<button id="autoFree" class="menu-item" title="Riel GD con posición propuesta por el programa">Rearmar con riel libre (GD)</button>
<button id="importMore" class="menu-item">Importar otro unifilar (PDF)…</button>
<hr><button id="openJson" class="menu-item">Abrir proyecto (JSON)…</button><button id="exportJson" class="menu-item">Guardar copia (JSON)</button>
</div></div>
<button class="primary" data-go="export">Exportar</button>
</div>
<input id="pdf" type="file" accept="application/pdf" hidden><input id="jsonFile" type="file" accept=".json,application/json" hidden>
</header>

<main id="screen-projects" class="screen"><div class="page">
<h1>Tableros</h1>
<label class="drop" id="dropPdf"><span class="drop-title">Arrastrá o elegí el PDF del unifilar</span><span class="muted">Exportado desde ABB e-Design DOC. El tablero se arma solo, ya dentro de normativa.</span><span class="primary btn">Elegir PDF</span><input id="pdfNew" type="file" accept="application/pdf" hidden></label>
<div id="projectCards" class="cards"></div>
<form id="newForm" class="newform"><input id="newProjectName" placeholder="Nuevo tablero vacío: nombre" aria-label="Nombre"><select id="newProjectEnclosure" aria-label="Gabinete"></select><button id="newProject" class="secondary" type="submit">Crear</button></form>
</div></main>

<main id="screen-editor" class="screen"><div class="editor">
<aside class="list"><div class="list-head">Circuitos <span id="deviceCount" class="muted"></span></div><div id="enclosureInfo" class="enc-chip"></div><div id="deviceList" class="items"></div><button id="showAdd" class="add">＋ Agregar equipo</button></aside>
<section class="canvas"><svg id="board" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 2450"></svg>
<div class="zoom"><button id="fit" class="icon" title="Ver tablero completo">⤢</button><button id="focus" class="icon" title="Acercar a los equipos">◎</button><button id="zoomOut" class="icon" aria-label="Alejar">−</button><span id="zoomLabel" class="muted">100%</span><button id="zoomIn" class="icon" aria-label="Acercar">＋</button></div>
<div id="message" class="toast" role="status"></div>
<div id="editor" class="card" hidden><div class="card-head"><strong id="selName"></strong><span id="selTag" class="muted"></span></div>
<label>Circuito<input id="circuit" placeholder="ej. TS-4.2"></label><label>Modelo<input id="model"></label>
<div id="selInfo" class="muted"></div><button id="remove" class="danger">Eliminar equipo</button></div>
</section></div>
<div id="addPanel" class="modal" hidden><form class="modal-box" id="addForm"><h2>Agregar equipo</h2><label>Equipo ABB<select id="shell"></select></label><label id="polesRow">Polos<input id="newPoles" type="number" min="2" max="4" value="2"></label><label>Nombre del circuito<input id="newCircuit" placeholder="ej. TS-4.12" autocomplete="off"></label><label>Modelo (opcional)<input id="newModel" placeholder="Referencia"></label><div class="row"><button type="button" id="addCancel" class="secondary">Cancelar</button><button id="add" class="primary" type="submit">Agregar</button></div></form></div>
</main>

<main id="screen-export" class="screen"><div class="page narrow">
<div class="page-head"><div><h1>Exportar <span id="exportProjectName"></span></h1><p id="exportSummary" class="muted"></p></div><button class="secondary" data-go="editor">Volver</button></div>
<div class="formats"><button id="exportDxf" class="format main"><strong>DXF</strong><span>AutoCAD · bloques, capas y atributos</span></button><button id="exportPdf" class="format"><strong>PDF</strong><span>Imprimir o enviar</span></button><button id="exportPng" class="format"><strong>PNG</strong><span>Imagen frontal</span></button><button id="exportSvg" class="format"><strong>SVG</strong><span>Vectorial editable</span></button></div>
<div id="exportWarning" class="note"></div>
<details class="fold"><summary>Lista de materiales <span id="bomCount" class="muted"></span></summary><div class="fold-body"><button id="exportBom" class="secondary">Descargar CSV</button><div class="tbl"><table><thead><tr><th>Categoría</th><th>Código</th><th>Descripción</th><th>Cant.</th><th>Estado</th></tr></thead><tbody id="bomTable"></tbody></table></div></div></details>
<details class="fold"><summary>Revisiones <span class="muted">· actual: <b id="currentRevision">sin emitir</b></span></summary><div class="fold-body"><label>Descripción<input id="revisionDescription" placeholder="Ej. Emisión inicial"></label><label>Responsable<input id="revisionAuthor" placeholder="Nombre"></label><button id="addRevision" class="secondary">Emitir revisión</button><div id="revisionList"></div></div></details>
<span id="summaryEnclosure" hidden></span><span id="summaryDevices" hidden></span><span id="summaryRails" hidden></span>
</div></main>

<script>
let project,catalog,fronts,appearances,projectList=[],selected=null,history=[],future=[],drag=null,pan=null,view=null;
let dirty=false,autosaveTimer=null,saveInFlight=false,validationTimer=null,validationResult={findings:[]},invalidTags=new Set();
let bomRows=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const shell=id=>catalog.deviceShells.find(x=>x.id===id);
// Medidas fijas: de la carcasa, o polos × módulo si la carcasa es por polo (catalog.deviceShells[].poleModule). Igual que importador.shell_size.
const shellSize=(s,poles)=>s.poleModule&&poles?{w:s.poleModule.width*poles,h:s.height}:{w:s.width,h:s.height};
function fixedDimensions(){for(const d of project.devices){const s=shell(d.shell);if(s){const z=shellSize(s,d.poles);d.w=z.w;d.h=z.h}}}
const rails=()=>project.enclosure.mountingLayout?.dinRails||[];
// Montaje en riel: lo dice la carcasa del catálogo, el importador (d.mounting) o catalog.modelHints para modelos sin CAD.
const isDin=d=>shell(d.shell)?.mounting==='din'||d.mounting==='din'||(catalog.modelHints||[]).some(h=>h.mounting==='din'&&new RegExp(h.modelRegex,'i').test(d.model||''));
function alignDin(d){const rail=rails()[0];if(!rail||!isDin(d))return;d.y=rail.y-d.h/2;d.x=Math.max(rail.x,Math.min(rail.x+rail.length-d.w,d.x))}
function frontDefs(){
 return `<defs>${Object.entries(fronts.items).map(([id,front],i)=>{
  const paint=appearances.items[id],blocks=paint?`<g transform="translate(0 1) scale(1 -1)"><rect x="0" y="0" width="1" height="1" style="fill:${paint.base};stroke:none"/>${paint.parts.map(([x,y,w,h,c])=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" style="fill:${c};stroke:none"/>`).join('')}</g>`:'';
  const logo=paint?.logo?`<text x="${paint.logo[0]}" y="${1-paint.logo[1]}" fill="white" font-size="0.035" font-weight="bold" font-family="Arial">${esc(paint.logo[2])}</text>`:'';
  return `<symbol id="abb-front-${i}" viewBox="0 0 1 1" overflow="visible">${blocks}${logo}<g transform="translate(0 1) scale(1 -1)" fill="none" stroke="${paint?.lineColor||'#263744'}" stroke-width="0.004" stroke-linecap="round" stroke-linejoin="round">${front.paths.map(path=>`<path d="M${path.map(p=>p.join(' ')).join('L')}"/>`).join('')}</g></symbol>`;
 }).join('')}</defs>`;
}
function frontSvg(d,x,y){
 const i=Object.keys(fronts.items).indexOf(d.shell),w=d.w,h=d.h;
 if(i<0)return `<g><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#fff3dd" stroke="#b57918" stroke-width="2" stroke-dasharray="4 3"/><text x="${x+w/2}" y="${y+h/2}" text-anchor="middle" font-size="8" fill="#7c4c05">SIN CAD</text></g>`;
 const s=shell(d.shell),tiles=s?.poleModule&&d.poles?d.poles:1,pw=w/tiles;
 let out='';for(let t=0;t<tiles;t++)out+=`<svg x="${x+t*pw}" y="${y}" width="${pw}" height="${h}" viewBox="0 0 1 1" preserveAspectRatio="none" overflow="hidden"><use href="#abb-front-${i}"/></svg>`;
 return out+tieBarSvg(d,x,y,tiles)+markingSvg(d,x,y);
}
// Marcado impreso del equipo real (apariencias_abb.json -> marking, en mm). Misma lógica que marcado.resolve (Python):
// si falta un dato del plano, ese texto no se dibuja. h = alto de mayúsculas → font-size = h/0.716 (Arial).
function whenOk(rule,poles){if(!rule)return true;const m=/^poles\s*(>=|<=|==|>|<)\s*(\d+)$/.exec(rule.trim());if(!m||poles==null)return false;const v=+m[2];return {'>=':poles>=v,'<=':poles<=v,'==':poles==v,'>':poles>v,'<':poles<v}[m[1]]}
function markingSvg(d,x,y){
 const mk=appearances.items[d.shell]?.marking,f=d.marking||{};if(!mk)return '';
 return mk.items.map(it=>{
  if(!whenOk(it.when,d.poles))return '';const names=[...it.text.matchAll(/\{(\w+)\}/g)].map(m=>m[1]);if(names.some(n=>f[n]==null))return '';
  const text=it.text.replace(/\{(\w+)\}/g,(_,n)=>f[n]),sy=y+d.h-it.y,fs=(it.h/.716).toFixed(3);
  const box=it.box?`<rect x="${x+it.box[0]}" y="${y+d.h-it.box[3]}" width="${it.box[2]-it.box[0]}" height="${it.box[3]-it.box[1]}" style="fill:none;stroke:${it.color};stroke-width:0.12;pointer-events:none"/>`:''; // style en línea: si no, lo pisa el CSS de .device rect
  const fit=it.w?` textLength="${it.w}" lengthAdjust="spacingAndGlyphs"`:'';
  return box+`<text x="${x+it.x}" y="${sy}" dominant-baseline="central" text-anchor="${it.align==='center'?'middle':'start'}" fill="${it.color}" font-size="${fs}" font-family="Arial" font-weight="${it.bold?'bold':'normal'}"${fit} style="pointer-events:none">${esc(text)}</text>`;
 }).join('');
}
function tieBarSvg(d,x,y,tiles){const b=appearances.items[d.shell]?.tieBar;if(!b||tiles<(b.minPoles||2))return '';return `<rect x="${x+b.x0}" y="${y+d.h-b.y1}" width="${d.w-b.x0-b.x1End}" height="${b.y1-b.y0}" style="fill:${b.color};stroke:${appearances.items[d.shell].lineColor};stroke-width:0.12;pointer-events:none"/>`}
let toastTimer=null;function notice(s){const m=$("message");m.textContent=s;m.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>m.classList.remove("show"),4500)}
function showScreen(name){
 if(!['projects','editor','export'].includes(name))name='projects';
 document.querySelectorAll('.screen').forEach(el=>el.classList.toggle('active',el.id===`screen-${name}`));
 $('crumb').hidden=name==='projects';$('editorActions').hidden=name!=='editor';
 document.querySelectorAll('.popover').forEach(p=>p.hidden=true);
 if(name==='editor')setTimeout(()=>{setView();render()},0);
 if(name==='export'){updateExportSummary();loadBom()}
 location.hash=name;
}
function updateExportSummary(){
 if(!project)return;
 const e=project.enclosure.externalBody,missing=project.devices.filter(d=>!fronts?.items?.[d.shell]);
 $('exportProjectName').textContent=project.project;
 $('summaryEnclosure').textContent=`${e.width} × ${e.height} × ${e.depth} mm`;$('summaryDevices').textContent=`${project.devices.length}`;$('summaryRails').textContent=`${rails().length}`;
 $('exportSummary').textContent=`${encSpec()?.label||'Gabinete'} · ${e.width} × ${e.height} × ${e.depth} mm · ${project.devices.length} equipos`;
 renderRevisions();
 const notes=[];if(validationResult.errors)notes.push(`${validationResult.errors} error(es) geométricos pendientes`);const bad=findings.filter(f=>f.severity==='error'&&!f.manual).length;if(bad)notes.push(`${bad} error(es) de normativa`);if(missing.length)notes.push(`${missing.map(nameOf).join(', ')}: sin CAD; se exportan como marcadores`);
 $('exportWarning').className='note'+(notes.length?' warn':'');$('exportWarning').textContent=notes.length?notes.join('. ')+'.':'Tablero dentro de normativa y sin errores geométricos.';
}
function renderProjectCards(){
 $('projectCards').innerHTML=projectList.map(p=>`<article class="card-p ${p.id===projectId?'current':''}"><h3>${esc(p.name)}</h3><span class="muted">${p.devices} equipos</span><div class="acts"><button class="primary grow" data-open="${esc(p.id)}">Abrir</button><button class="secondary" data-dup="${esc(p.id)}">Duplicar</button>${p.id==='ts4'?'':`<button class="danger" data-del="${esc(p.id)}">Borrar</button>`}</div></article>`).join('');
 $('projectCards').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{if(b.dataset.open===projectId)return showScreen('editor');location.search='?id='+encodeURIComponent(b.dataset.open)+'#editor'});
 $('projectCards').querySelectorAll('[data-dup]').forEach(b=>b.onclick=async()=>{const name=(prompt('Nombre de la copia')||'').trim();if(!name)return;const r=await fetch('/api/project-duplicate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sourceId:b.dataset.dup,name})});const data=await r.json();if(!r.ok)return notice(data.error);location.search='?id='+encodeURIComponent(data.id)+'#editor'});
 $('projectCards').querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Borrar definitivamente este tablero?'))return;const r=await fetch('/api/project?id='+encodeURIComponent(b.dataset.del),{method:'DELETE'});const data=await r.json();if(!r.ok)return notice(data.error);if(b.dataset.del===projectId){location.search='?id=ts4'}else{projectList=projectList.filter(p=>p.id!==b.dataset.del);renderProjectCards()}});
}
function markDirty(){dirty=true;$('saveStatus').textContent='Cambios pendientes';scheduleAutosave()}
function snapshot(){history.push(clone(project));if(history.length>40)history.shift();future=[];$('undo').disabled=false;if($('redo'))$('redo').disabled=true;markDirty()}
function scheduleAutosave(){
 clearTimeout(autosaveTimer);
 autosaveTimer=setTimeout(()=>{localStorage.setItem(`abb-draft-${projectId}`,JSON.stringify({projectId,project,savedAt:new Date().toISOString()}));saveProject(true)},1500);
}
async function saveProject(silent=false){
 if(saveInFlight)return;saveInFlight=true;clearTimeout(autosaveTimer);
 try{const r=await fetch('/api/save?id='+encodeURIComponent(projectId),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(project)});if(!r.ok)throw Error((await r.json()).error);dirty=false;localStorage.removeItem(`abb-draft-${projectId}`);$('saveStatus').textContent=silent?'Autoguardado':'Guardado';if(!silent)notice('Tablero guardado ('+projectId+')')}
 catch(error){dirty=true;$('saveStatus').textContent='Error al guardar';if(!silent)notice(error.message)}finally{saveInFlight=false}
}
function scheduleValidation(){clearTimeout(validationTimer);validationTimer=setTimeout(runValidation,350)}
async function runValidation(){
 const r=await fetch('/api/validate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(project)});if(!r.ok)return;
 validationResult=await r.json();invalidTags=new Set(validationResult.findings.filter(f=>f.level==='error').flatMap(f=>f.tags));
updateChip();
 document.querySelectorAll('.device').forEach(g=>{const d=project.devices[+g.dataset.index],hit=g.querySelector('.hitbox');if(hit&&invalidTags.has(d.tag)){hit.style.stroke='#d92d20';hit.style.strokeWidth='5';hit.style.strokeDasharray='7 4'}else if(hit){hit.style.stroke='none'}});
 updateExportSummary();
}
async function loadBom(){
 if(!project||!$('bomTable'))return;const r=await fetch('/api/bom',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(project)});if(!r.ok)return;
 bomRows=(await r.json()).rows;$('bomTable').innerHTML=bomRows.map(row=>`<tr><td>${esc(row.category)}</td><td>${esc(row.code)}</td><td>${esc(row.description)}</td><td>${row.quantity}</td><td>${esc(row.status)}</td></tr>`).join('');$('bomCount').textContent=`${bomRows.length} renglones agrupados`;
}
function renderRevisions(){
 if(!$('revisionList'))return;const revisions=project.revisions||[];$('currentRevision').textContent=project.currentRevision??'sin emitir';$('revisionList').innerHTML=revisions.length?revisions.slice().reverse().map(item=>`<div class="rev"><strong>Rev. ${esc(item.code)}</strong> · ${esc(item.date)}<br>${esc(item.description)}<br><span class="hint">${esc(item.author)}</span></div>`).join(''):'<p class="hint">Todavía no hay revisiones emitidas.</p>';
}
async function createRevision(){
 const description=$('revisionDescription').value.trim(),author=$('revisionAuthor').value.trim();if(!description)return notice('Ingresá la descripción de la revisión.');
 const r=await fetch('/api/revision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({project,description,author})});const data=await r.json();if(!r.ok)return notice(data.error);snapshot();project=data.project;$('revisionDescription').value='';renderRevisions();render();await saveProject(false);notice(`Revisión ${data.revision.code} emitida.`)
}
function dimensions(){const e=project.enclosure;return {w:e.externalBody.width,h:e.overallHeightWithPlinth,fx:e.functionalAreaOffset.x,fy:e.functionalAreaOffset.y}}
function setView(){const {w,h}=dimensions();if(!view)view={x:-140,y:-90,w:w+270,h:h+260};$('board').setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`)}
function fitView(){view=null;setView()}
function focusView(){const {fx,fy,h}=dimensions(),ds=project.devices;if(!ds.length)return fitView();const x0=Math.min(...ds.map(d=>fx+d.x)),x1=Math.max(...ds.map(d=>fx+d.x+d.w)),y0=Math.min(...ds.map(d=>h-fy-d.y-d.h)),y1=Math.max(...ds.map(d=>h-fy-d.y));view={x:x0-100,y:y0-120,w:x1-x0+200,h:y1-y0+240};setView()}
function zoomView(factor){setView();const cx=view.x+view.w/2,cy=view.y+view.h/2;view.w*=factor;view.h*=factor;view.x=cx-view.w/2;view.y=cy-view.h/2;setView()}
let findings=[],normaTimer=null;
// Estructura real del gabinete (montantes/travesaños, hojas de puerta) a partir de catalogo_abb.json -> enclosures[].structure
const encSpec=()=>catalog.enclosures.find(v=>v.id===project.enclosure.id)||catalog.enclosures.find(v=>v.functional.height===project.enclosure.functional.height&&v.functional.width===project.enclosure.functional.width);
function structureSvg(w,h,plinth){const st=encSpec()?.structure;if(!st)return '';const mono=!st.frameBand,bh=h-plinth,b=st.frameBand,fill=st.colors?.frame?.hex||'#cfd6de',ln='#6c7b8c',plinthFill=st.colors?.plinth?.hex||'#dfe4ea';let o='<g style="pointer-events:none">';
 // gabinete de estructura: marco de montantes/travesaños (banda = externo - funcional); el monobloc (SR2) no tiene banda ni zócalo
 if(!mono)o+=`<path d="M0 0H${w}V${bh}H0Z M${b} ${b}V${bh-b}H${w-b}V${b}Z" fill-rule="evenodd" style="fill:${fill};stroke:${ln};stroke-width:1.5"/>`;
 // hojas de puerta (vista con puertas retiradas): contorno de trazos
 let x=0;st.doorLeaves.forEach((lw,i)=>{o+=`<rect x="${x+3}" y="3" width="${lw-6}" height="${bh-6}" style="fill:none;stroke:#8b97a6;stroke-width:1.5;stroke-dasharray:14 8"/>`;if(i===0)o+=``;x+=lw});
 if(plinth)o+=`<rect x="0" y="${bh}" width="${w}" height="${plinth}" style="fill:${plinthFill};stroke:#3b4344;stroke-width:2"/><line x1="40" y1="${bh+plinth*.5}" x2="${w-40}" y2="${bh+plinth*.5}" style="stroke:#7d8586;stroke-width:1"/>`;
 return o+'</g>'}
let projectId=new URLSearchParams(location.search).get('id')||'ts4';
// Accesorios de normativa: rectángulos esquemáticos con las medidas del catálogo (hasta tener el CAD de cada pieza).
// Porta-etiqueta de identificación bajo el equipo (rótulo con el tag del plano). Tamaño propuesto, no dato ABB.
function labelHolder(d,x,y){const lw=Math.min(Math.max(d.w-4,14),64),lh=12,lx=x+(d.w-lw)/2,ly=y+d.h+4;
 return `<g style="pointer-events:none"><g filter="url(#shDev)"><rect x="${lx}" y="${ly}" width="${lw}" height="${lh}" rx="1.5" fill="#f4f1e6" stroke="#6d6a5c" stroke-width=".8"/></g><text x="${lx+lw/2}" y="${ly+8.6}" text-anchor="middle" font-size="${Math.min(8.5,lw/Math.max(nameOf(d).length,1)/.62).toFixed(1)}" fill="#1c1c1c" font-weight="700">${esc(nameOf(d))}</text></g>`}
// Canaleta ranurada (esquemática): uñas laterales con ranuras verticales y tapa central; paso de ranura 12 o 6 mm según el catálogo (8x12 / 4x6).
function ductSvg(a,fx,h,fy){const x=fx+a.x,y=h-fy-a.y-a.h,pitch=a.slot==='4x6'?6:12,slotW=a.slot==='4x6'?4:8,fing=Math.max(3,a.h*.3),n=Math.floor(a.w/pitch);
 const slots=Array.from({length:n},(_,i)=>{const sx=x+i*pitch+(pitch-slotW)/2;return `<rect x="${sx}" y="${y+1}" width="${slotW*.5}" height="${fing-1}" fill="#8e9599"/><rect x="${sx}" y="${y+a.h-fing}" width="${slotW*.5}" height="${fing-1}" fill="#8e9599"/>`}).join('');
 return `<g style="pointer-events:none"><g filter="url(#shDev)"><rect x="${x}" y="${y}" width="${a.w}" height="${a.h}" rx="1" fill="#d3d6d8" stroke="#7d868c" stroke-width=".8" style="stroke-dasharray:${a.provisional?'6 2':'0'}"/></g>${slots}<rect x="${x}" y="${y+fing}" width="${a.w}" height="${a.h-2*fing}" fill="#e6e8e9" stroke="#aeb4b8" stroke-width=".5"/><rect x="${x}" y="${y+fing}" width="${a.w}" height="${(a.h-2*fing)*.3}" fill="#fff" opacity=".5"/></g>`}
// Peine: cuerpo aislante apoyado sobre los equipos y una clavija de cobre por polo (paso del catálogo, 17,5 mm).

 $('exportDxf').onclick=async()=>{const r=await fetch('/api/export-dxf',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(project)});if(!r.ok)return notice((await r.json()).error);download(filename('dxf'),await r.blob(),'application/dxf')};
 $('exportSvg').onclick=()=>download(filename('svg'),saveSvg(),'image/svg+xml');
 $('exportPng').onclick=()=>{const blob=new Blob([saveSvg()],{type:'image/svg+xml'}),url=URL.createObjectURL(blob),img=new Image();img.onload=()=>{const cv=document.createElement('canvas');cv.width=1650;cv.height=Math.round(cv.width*dimensions().h/dimensions().w);const ctx=cv.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,cv.width,cv.height);ctx.drawImage(img,0,0,cv.width,cv.height);cv.toBlob(b=>download(filename('png'),b,'image/png'));URL.revokeObjectURL(url)};img.src=url};
 $('exportPdf').onclick=()=>{const previous=clone(view);fitView();window.print();view=previous;setView()};
const importPdf=async(file,fresh)=>{if(!file)return;notice('Leyendo PDF…');
   if(fresh){const name=file.name.replace(/\.pdf$/i,'').replace(/[_-]+/g,' ').trim()||'Tablero';const r0=await fetch('/api/project-new',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,enclosureId:catalog.enclosures[0].id})});const d0=await r0.json();if(!r0.ok)return notice(d0.error);projectId=d0.id;project=await fetch('/api/project?id='+encodeURIComponent(projectId)).then(x=>x.json());history=[];future=[];selected=null;view=null;findings=[];$('undo').disabled=true;window.history.replaceState(null,'','?id='+encodeURIComponent(projectId)+'#editor');projectList=await fetch('/api/projects').then(x=>x.json());renderProjectCards()}
   const r=await fetch('/api/import-pdf',{method:'POST',body:file});const data=await r.json();if(!r.ok)return notice(data.error);
   const add=data.devices.filter(d=>!d.upstream&&d.shell&&!project.devices.some(x=>x.tag===d.tag)),skipped=data.devices.filter(d=>!d.upstream&&!d.shell).length;
   if(!add.length){showScreen('editor');return notice('No se detectaron equipos nuevos de 2 o más polos.')}
   snapshot();for(const d of add)project.devices.push({...d,x:150,y:150,unplaced:true});notice('Armando el tablero…');const auto=await runAuto(false);if(!auto.ok)await placeUnplaced();
   showScreen('editor');notice(auto.ok?`Tablero armado en ${auto.gabinete} con ${add.length} equipo(s).`+(skipped?` ${skipped} sin carcasa reconocida.`:''):`No se pudo armar solo: ${auto.error}`)};
  $('pdf').onchange=async e=>{await importPdf(e.target.files[0],false);e.target.value=''};$('pdfNew').onchange=async e=>{await importPdf(e.target.files[0],true);e.target.value=''};$('importMore').onclick=()=>{$('moreMenu').hidden=true;$('pdf').click()};
  const dz=$('dropPdf');dz.ondragover=e=>{e.preventDefault();dz.classList.add('over')};dz.ondragleave=()=>dz.classList.remove('over');dz.ondrop=async e=>{e.preventDefault();dz.classList.remove('over');await importPdf(e.dataTransfer.files[0],true)};
 const svg=$('board');svg.onpointerdown=e=>{const g=e.target.closest('.device');if(!g){pan={x:e.clientX,y:e.clientY};svg.setPointerCapture(e.pointerId);return}select(+g.dataset.index);drag={index:selected,point:svg.createSVGPoint(),start:clone(project.devices[selected]),saved:false};svg.setPointerCapture(e.pointerId)};
 svg.onpointermove=e=>{if(pan){view.x-=(e.clientX-pan.x)*view.w/svg.clientWidth;view.y-=(e.clientY-pan.y)*view.h/svg.clientHeight;pan={x:e.clientX,y:e.clientY};setView();return}if(!drag)return;if(!drag.saved){snapshot();drag.saved=true}const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const a=pt.matrixTransform(svg.getScreenCTM().inverse()),{fx,fy,h}=dimensions(),d=project.devices[drag.index];d.x=Math.round(Math.max(0,Math.min(project.enclosure.functional.width-d.w,a.x-fx-d.w/2)));if(isDin(d))alignDin(d);else d.y=Math.round(Math.max(0,Math.min(project.enclosure.functional.height-d.h,h-fy-a.y-d.h/2)));render()};
 svg.onpointerup=()=>{if(drag&&drag.saved&&project.devices[drag.index]){delete project.devices[drag.index].unplaced;delete project.devices[drag.index].placementNote}drag=null;pan=null};svg.onpointercancel=()=>{drag=null;pan=null};
 svg.addEventListener('wheel',e=>{e.preventDefault();zoomView(e.deltaY<0?.85:1.18)},{passive:false});
 document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>showScreen(b.dataset.screen));
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>showScreen(b.dataset.go));
 showScreen((location.hash||'#projects').slice(1));
 render();
});
window.addEventListener('beforeunload',event=>{if(!dirty)return;event.preventDefault();event.returnValue=''})
</script>
</body></html>
